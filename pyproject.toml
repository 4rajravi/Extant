[project]
name = "extant"
version = "0.0.0"
description = "Question answering over Indian regulatory corpora, with verified citations or a refusal."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.165.0",
    "httpx>=0.28.1,<1",
    "langchain>=1,<2",
    "langchain-anthropic>=1,<2",
    "langgraph>=1,<2",
    "mcp==2.3.0",
    "pdfplumber>=0.11.10,<0.12",
    "psycopg-pool==3.3.3",
    "psycopg[binary]>=3.3.9,<4",
    "pydantic>=2.14.3,<3",
    "pydantic-settings>=2.16.3,<3",
    "pymupdf>=1.26,<2",
    "selectolax>=1.0.2,<2",
]

[dependency-groups]
ablation = [
    "sentence-transformers>=5,<6",
    "torch>=2.6,<3",
]
dev = [
    "hypothesis>=6.100,<7",
    "mypy>=2.4.1,<3",
    "pytest>=9.2.0,<10",
    "pytest-playwright>=0.10.0,<0.11",
    "ruff>=0.17.5,<0.18",
]
# The retrieval eval harness (evals/): installed by default, so CI can run the gate. Serving
# never imports it, and a test holds that line.
eval = [
    "pyarrow>=21,<24",
]

[tool.uv]
# `ablation` is left out on purpose: local models and PyTorch for the offline arms 4 and 5,
# installed only with `uv sync --group ablation`, never in CI.
default-groups = ["dev", "eval"]

[build-system]
requires = ["uv_build>=0.11.5,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "extant"
module-root = ""

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
  "E", "W", "F",  # pycodestyle, pyflakes
  "I",            # isort
  "B",            # bugbear
  "UP",           # pyupgrade
  "SIM",          # simplify
  "C4",           # comprehensions
  "RET",          # return
  "N",            # naming
  "S",            # bandit, catches f-string SQL (S608)
  "PT",           # pytest style
  "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S311"]
# Seeded sampling for eval sets and bootstrap intervals, never for secrets.
"evals/**" = ["S311"]
# The answer level question table: one question per line reads as a table; wrapped it does not.
"evals/answers/sets.py" = ["S311", "E501"]

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["extant", "evals"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# No type information is published for these; the eval harness wraps each in one module.
module = ["pyarrow", "pyarrow.*", "sentence_transformers", "sentence_transformers.*", "torch"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not smoke and not web"]
markers = [
  "integration: needs a real PostgreSQL with pgvector, reached through EXTANT_WRITER_DSN",
  "smoke: the ten-query smoke suite; needs a built index and an embedding API key (pytest -m smoke)",
  "web: the page in Playwright's Chromium; needs `playwright install chromium` (pytest -m web)",
]
