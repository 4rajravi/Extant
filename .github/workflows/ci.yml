name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: extant
          POSTGRES_PASSWORD: extant_ci
          POSTGRES_DB: extant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U extant -d extant"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      # Throwaway credentials for the service container above, nothing real.
      EXTANT_WRITER_DSN: postgresql://extant:extant_ci@localhost:5432/extant
      EXTANT_READER_DSN: postgresql://extant_reader:extant_reader_ci@localhost:5432/extant
      # Turns a missing database into a failure instead of skipped integration tests.
      EXTANT_REQUIRE_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install (lockfile must be current)
        id: install
        run: uv sync --locked

      # Each check runs even if an earlier one failed, so one push reports every failure.
      # Any failed step still turns the job red.
      - name: ruff check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run ruff check .

      - name: ruff format --check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run ruff format --check .

      - name: mypy --strict
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run mypy

      - name: pytest, unit and integration
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run pytest

      # The page in a real browser (tests/web): the two Playwright smoke tests are the gate
      # for the frontend. They run on a replaying runtime: no database, no model.
      - name: Install Chromium for Playwright
        id: chromium
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run playwright install --with-deps chromium

      - name: pytest, the page in Chromium
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: uv run pytest -m web

  # The retrieval gate: the shipped arm on every eval set's dev split, against the committed
  # baseline. It reads the published build on Neon as the read only role and embeds nothing
  # (query vectors are committed), so it is free to run on every push. See evals/README.md.
  retrieval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXTANT_READER_DSN: ${{ secrets.EXTANT_EVAL_READER_DSN }}
      INDEX_SCHEMA: ${{ vars.EXTANT_INDEX_SCHEMA }}
    steps:
      - uses: actions/checkout@v4

      # Until Neon is set up there is no published build to read, so the gate skips with a
      # warning on the run's summary page instead of failing every push. Once the secret and
      # the variable exist, every step below runs and a regression fails the job.
      - name: The gate is configured
        id: config
        run: |
          if [ -z "$EXTANT_READER_DSN" ] || [ -z "$INDEX_SCHEMA" ]; then
            echo "::warning::Retrieval gate SKIPPED: no published build to read. Add the repository secret EXTANT_EVAL_READER_DSN and the variable EXTANT_INDEX_SCHEMA (evals/README.md, 'CI gate')."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v6
        if: steps.config.outputs.configured == 'true'
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install (lockfile must be current)
        if: steps.config.outputs.configured == 'true'
        run: uv sync --locked

      - name: Retrieval eval
        if: steps.config.outputs.configured == 'true'
        run: uv run python -m evals.retrieval --schema "$INDEX_SCHEMA" --out results.parquet

      - name: Gate against baseline
        if: steps.config.outputs.configured == 'true'
        run: uv run python -m evals.gate --baseline evals/baseline.json --results results.parquet

      - name: Keep the per query results
        if: ${{ !cancelled() && steps.config.outputs.configured == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval-results
          path: results*.parquet
          if-no-files-found: ignore
